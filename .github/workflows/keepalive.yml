# Keeps the Supabase project from being paused.
#
# Supabase pauses Free Plan projects after 7 days of low database activity,
# and restoring one is a manual click in the dashboard — meaning the app is
# simply down until somebody notices. Any database activity resets that timer,
# so this writes a single timestamp twice a week.
#
# Setup (once):
#   1. Apply supabase/migrations/0008_keepalive.sql.
#   2. In the repo: Settings → Secrets and variables → Actions → New secret
#        SUPABASE_URL       = https://YOUR-PROJECT.supabase.co
#        SUPABASE_ANON_KEY  = your anon key
#      The anon key is safe here — it already ships inside the app, and the
#      function it calls cannot read or change anything else.
#   3. Actions tab → "Keep Supabase awake" → Run workflow, to check it works.
#
# NOTE: GitHub disables scheduled workflows in a repository with no commits
# for 60 days. If you stop working on this for two months, re-enable it from
# the Actions tab — or the pause timer starts running again.
name: Keep Supabase awake

on:
  schedule:
    # Mondays and Thursdays at 06:00 UTC — a maximum gap of four days, which
    # leaves three days of headroom inside the seven-day window even if one
    # run is skipped or delayed.
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repository secrets are not set."
            exit 1
          fi

          status=$(curl --silent --show-error --location \
            --max-time 30 \
            --output /tmp/response.txt \
            --write-out '%{http_code}' \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/record_heartbeat" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP ${status}"
          cat /tmp/response.txt

          # A 404 here almost always means 0008_keepalive.sql was never
          # applied, so say that rather than just failing on a status code.
          if [ "${status}" = "404" ]; then
            echo "::error::record_heartbeat() not found — apply supabase/migrations/0008_keepalive.sql."
            exit 1
          fi

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Heartbeat failed with HTTP ${status}. The project may already be paused — restore it in the Supabase dashboard."
            exit 1
          fi

          echo "Project is awake."
